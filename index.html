<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Журнал ТОиР</title>
<meta name="theme-color" content="#24455E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Журнал ТОиР">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: мобильная «планшетка» механика — стальная шапка со сканером, вкладки, карточки агрегатов.
   Шрифты системные: приложение должно выглядеть одинаково без интернета. */
:root{
  --bg:#E9ECEA; --paper:#FFFFFF; --ink:#1B2328; --muted:#5B666C; --line:#CDD3D1;
  --steel:#24455E; --steel-ink:#FFFFFF; --mark:#E0A526; --mark-ink:#1B2328;
  --ok:#2E7D4F; --ok-bg:#E3F1E8; --warn:#A8620E; --warn-bg:#FBEFD9; --bad:#B3321F; --bad-bg:#F8E1DC;
  --f-disp:"Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Roboto Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141A1E; --paper:#1D252B; --ink:#E6EAEA; --muted:#98A3A8; --line:#34414A;
  --steel:#1F3A50; --steel-ink:#E6EAEA; --mark:#E8B444; --mark-ink:#141A1E;
  --ok:#6CC592; --ok-bg:#1B3226; --warn:#E8A850; --warn-bg:#3A2C15; --bad:#EE8472; --bad-bg:#3D1F1A; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body)}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
header.top{position:sticky;top:0;z-index:5;background:var(--steel);color:var(--steel-ink);margin-inline:-16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top .t{font:700 17px/1.15 var(--f-disp);letter-spacing:.02em;flex:1;min-width:0}
header.top .t small{display:block;font:500 11px var(--f-body);opacity:.8;letter-spacing:.06em;text-transform:uppercase}
.hbtn{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:7px 11px;font:600 14px var(--f-body);cursor:pointer;white-space:nowrap}
.hbtn.scan{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
nav.tabs{display:flex;gap:6px;margin:14px 0;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:1 0 auto;padding:9px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;font:700 14px var(--f-disp);letter-spacing:.03em;cursor:pointer}
nav.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}
h2{font-size:20px;font-weight:700} h3{font-size:16px;font-weight:700}
.lbl{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
.note{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font:700 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)}
.unit{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:10px;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.tag{font:700 12px var(--f-mono);background:var(--mark);color:var(--mark-ink);padding:3px 6px;border-radius:4px;white-space:nowrap}
.unit .m{flex:1;min-width:0}
.unit .m b{font:700 16px var(--f-disp);display:block}
.pill{display:inline-block;font:600 12px var(--f-body);padding:3px 8px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-none{background:var(--bg);color:var(--muted)}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 14px;margin-top:10px}
.specs div{min-width:0}.specs b{display:block;font:700 15px var(--f-mono)}
.btn{display:block;width:100%;padding:13px;border-radius:9px;border:0;background:var(--steel);color:var(--steel-ink);font:700 16px var(--f-disp);letter-spacing:.03em;cursor:pointer;text-align:center}
.btn.sec{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;padding:9px 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.photo-btn:focus-within{outline:3px solid var(--mark);outline-offset:2px}
.node{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.node>summary{list-style:none;display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.node>summary::-webkit-details-marker{display:none}
.node>summary .n{font:700 12px var(--f-mono);color:var(--muted);width:22px}
.node>summary h3{flex:1;min-width:0}
.node .body{border-top:1px solid var(--line);padding:6px 14px 14px;display:flex;flex-direction:column;gap:10px}
.node.has-bad{border-left:4px solid var(--bad)}
.item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-top:8px}
.item .q{flex:1 1 220px;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:9px 11px;font:600 13px var(--f-body);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.ok{background:var(--ok-bg);color:var(--ok)}
.seg button.on.bad{background:var(--bad-bg);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 11px;font:500 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
input[type=text],input[type=number],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:16px var(--f-body)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid2 label{display:flex;flex-direction:column;gap:4px;min-width:0}
.hint{font-size:12px;color:var(--muted)} .hint.bad{color:var(--bad);font-weight:600}
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.verdict button{padding:12px;border-radius:9px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:600 14px var(--f-body);cursor:pointer;text-align:left}
.verdict button.on[data-v="ok"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.verdict button.on[data-v="warn"]{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.verdict button.on[data-v="bad"]{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.savebar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar .in .btn{flex:1}
.progress{font:600 13px var(--f-mono);color:var(--muted);white-space:nowrap}
.rec{padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.rec .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec ul{margin:0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font:500 14px var(--f-body);z-index:30;max-width:calc(100% - 32px)}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.qr{background:#fff;color:#111;border:2px dashed #999;border-radius:8px;padding:12px;text-align:center;display:block}
.qr img{width:150px;height:150px;image-rendering:pixelated}
.qr .c{font:700 19px var(--f-mono);margin-top:4px} .qr .d{font:500 13px var(--f-body)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.thumb button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:26px;height:26px;background:var(--ink);color:var(--bg);font:700 15px/26px var(--f-body);cursor:pointer;padding:0}
label.photo-btn{position:relative;display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border:1px dashed var(--steel);border-radius:8px;color:var(--ink);font:600 13px var(--f-body);cursor:pointer}
label.photo-btn input{position:absolute;opacity:0;width:1px;height:1px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px;color:#fff}
.overlay img{max-width:100%;max-height:100%;border-radius:6px}
.scanbox{position:relative;width:min(88vw,420px);aspect-ratio:1;border-radius:14px;overflow:hidden;background:#000}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanbox::after{content:"";position:absolute;inset:18%;border:3px solid #E0A526;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.rem{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px}
.rem.closed{border-left-color:var(--ok);opacity:.75}
.rem .m{flex:1;min-width:0}
.site-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6CC592;margin-right:6px;vertical-align:middle}
.statusdot.off{background:#E8A850}
@media print{header,nav,.no-print,.savebar{display:none!important}.qr{border:1px dashed #888}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="hbtn" id="backBtn" hidden aria-label="Назад">←</button>
    <div class="t" id="topTitle"></div>
    <button class="hbtn scan" id="scanBtn">Сканировать</button>
  </header>
  <div id="updBanner" class="banner" hidden><span>Доступна новая версия приложения</span><button class="btn sm" id="updBtn">Обновить</button></div>
  <main id="view"></main>
</div>
<div class="savebar" id="savebar" hidden><div class="in"><span class="progress" id="prog"></span><button class="btn" id="saveBtn">Сохранить осмотр</button></div></div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="overlay" id="lightbox" hidden><img id="lbImg" alt="Фото"></div>
<div class="overlay" id="scanner" hidden>
  <div class="scanbox"><video id="scanVideo" playsinline muted></video></div>
  <div id="scanMsg" style="text-align:center">Наведите камеру на QR-метку агрегата</div>
  <button class="btn sec sm" id="scanClose" style="color:#111;background:#fff">Закрыть</button>
</div>
<canvas id="scanCanvas" hidden></canvas>

<script src="equipment.js"></script>
<script src="qrcode.js"></script>
<script src="jsQR.js"></script>
<script src="xlsx-lite.js"></script>
<script src="app.js"></script>
</body>
</html>
